<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NT Earn Hub</title>
    <!-- Tailwind CSS for Fancy Look -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen font-sans">

    <!-- Header -->
    <header class="p-6 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">NT Earn Hub</h1>
            <p class="text-gray-400 text-sm">Professional Task System</p>
        </div>
        <div class="w-10 h-10 bg-cyan-900 rounded-full flex items-center justify-center font-bold">N</div>
    </header>

    <!-- Main Dashboard -->
    <main class="p-6 space-y-6">
        
        <!-- Balance Card -->
        <section class="glass-card p-6 rounded-3xl shadow-2xl border-cyan-500/20">
            <p class="text-cyan-400 font-medium">Available Balance</p>
            <h2 class="text-5xl font-bold mt-2 tracking-tighter">$0.00 <span class="text-lg text-gray-500 font-normal">USDT</span></h2>
            <button class="mt-4 w-full bg-cyan-600 hover:bg-cyan-500 py-3 rounded-xl font-bold transition">Withdraw Funds</button>
        </section>

        <!-- Tasks List -->
        <section>
            <h3 class="text-xl font-semibold mb-4">Daily Tasks</h3>
            <div id="task-container" class="space-y-4">
                <!-- Task Card -->
                <div class="glass-card p-4 rounded-2xl flex justify-between items-center">
                    <div>
                        <h4 class="font-bold">Project Engagement</h4>
                        <p class="text-xs text-gray-400">Reward: $0.10</p>
                    </div>
                    <button class="bg-gray-800 px-4 py-2 rounded-lg text-sm font-bold border border-gray-700 hover:border-cyan-500 transition">View</button>
                </div>
            </div>
        </section>
    </main>

    <!-- Firebase Connection Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLEnhC545LNW9GyKfWaJPJCrOKUotYqpY",
            authDomain: "nt-earn-hub.firebaseapp.com",
            projectId: "nt-earn-hub",
            storageBucket: "nt-earn-hub.firebasestorage.app",
            messagingSenderId: "606638253911",
            appId: "1:606638253911:web:77a1e0323e2e70afec4012",
            measurementId: "G-8N1M11X38T"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        console.log("NT Earn Hub Engine Initialized!");
    </script>
</body>
</html>
